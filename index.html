<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner Dashboard Prototypes</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f9fb; color: #293038; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    main { width: min(560px, calc(100vw - 32px)); }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #57606b; margin: 0 0 24px; line-height: 1.5; }
    a { display: block; padding: 20px 24px; margin-bottom: 12px; background: #fff; border: 1px solid #eff1f4; border-radius: 16px; color: inherit; text-decoration: none; transition: box-shadow .3s, translate .3s; }
    a:hover { translate: 0 -2px; box-shadow: 0 10px 28px rgba(16,24,40,.08); }
    strong { display: block; font-size: 18px; margin-bottom: 4px; }
    span { color: #57606b; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>DentalBase · Home dashboard</h1>
    <p>Static prototypes of the practice-owner home page. Demo data only.</p>
    <a href="v1/"><strong>Version 1</strong><span>Figma design with motion, quick wins and Dr. Denti</span></a>
    <a href="v2/"><strong>Version 2</strong><span>Readability pass for busy, non-technical owners</span></a>

</html>
